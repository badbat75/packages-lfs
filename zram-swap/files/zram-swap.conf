# Compressed swap on /dev/zram0: zram-swap.service reads this file as its EnvironmentFile
# Percentage of the RAM the device holds (ZRAM_DEVSIZE overrides it with a size in bytes)
ZRAM_SIZE_PERCENT=50
# Compression algorithm of the device (lzo, lz4, zstd): unknown to the kernel, the default of
# the kernel stays
ZRAM_ALGO=zstd
# Priority of the swap device over the other ones (swapon -p)
ZRAM_PRIORITY=100
